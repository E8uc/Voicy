name = "voicy"
main = "src/worker.js"
compatibility_date = "2026-09-25"
workers_dev = true
keep_vars = true

[vars]
DISCORD_APPLICATION_ID = "1545438694725652490"
DISCORD_PUBLIC_KEY = "66ecc96b36f7aa337ea59b569a19fbb617fd13b3b9539c56fb02229ce9b2402c"

# Optional: set "*" (default) or your GitHub Pages origin, e.g. https://USERNAME.github.io
# ALLOWED_ORIGIN = "https://USERNAME.github.io"
# Unused voices are deleted after this many hours (default 24). Used voices are deleted right after sending.
# VOICE_TTL_HOURS = "24"

# Storage for recorded voices. Wrangler creates this namespace automatically on deploy.
# If your deploy complains, create one (npx wrangler kv namespace create VOICES) and add: id = "..."
[[kv_namespaces]]
binding = "VOICES"
